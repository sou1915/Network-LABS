<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Network LABS · Gestion native</title><style>
@font-face{font-family:Inter;src:url('/InterVariable.ttf')}*{box-sizing:border-box}body{margin:0;background:#eef3f9;color:#172c43;font:14px Inter,Arial,sans-serif}button,input,select,textarea{font:inherit;border:1px solid #dce6f1;border-radius:12px;padding:10px 14px;background:white;color:inherit}button{cursor:pointer}button:hover{background:#e8f3ff}button:disabled{opacity:.5;cursor:default}input:focus,select:focus{outline:2px solid #85bbf5}header{background:#243746;color:white;margin:18px;border-radius:18px;padding:14px 22px;display:flex;align-items:center;gap:20px}header strong{font-size:17px}header span{color:#c5d5e5}header button{margin-left:auto;color:var(--ink,#172c43)}header select{color:#172c43;min-width:170px}.layout{display:grid;grid-template-columns:218px 1fr;gap:18px;margin:18px}aside{background:#253440;border-radius:18px;padding:16px;align-self:start;color:white}aside button{display:block;width:100%;margin:6px 0;background:transparent;color:#edf4fa;border-color:transparent;text-align:left}aside button.active{background:#3c566e}main{min-width:0}.brand{background:#df1723;color:white;border-radius:18px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between}.brand strong{font-size:22px}.card{border:1px solid #e0e8f2;background:white;border-radius:18px;padding:22px;margin-top:16px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.metric{background:#f4f8fd;padding:15px;border-radius:14px}.metric strong{display:block;font-size:25px;margin-top:7px}.options-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.options-grid label{min-width:0}.options-grid input,.options-grid select{width:100%}.rowactions{display:flex;gap:5px}.rowactions button{padding:5px 9px}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.selected td{background:#edf6ff}fieldset{border:1px solid #e1e9f3;border-radius:14px;padding:16px;margin:14px 0}legend{font-size:13px;font-weight:600;padding:0 8px}h1{margin:0 0 8px;font-size:22px}h2{font-size:16px;margin:0 0 16px}.muted{color:#66788f;font-size:12px}.table{border:1px solid #e1e9f3;border-radius:14px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:13px 16px;text-align:left;border-bottom:1px solid #edf1f6}th{background:#f3f7fb}tr:last-child td{border:0}tr.selected td{background:#eaf3ff}td button{padding:6px 12px}.good{color:#158a49}.badge{display:inline-block;margin-top:4px;border-radius:20px;padding:6px 12px;background:#f4f7fb;color:#546c84;font-size:12px}.form{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:grid;gap:7px;font-size:12px;color:#66788f}label.check{display:flex;align-items:center}.actions{display:flex;gap:10px;margin-top:18px}.primary{background:#087fe9;color:white;border-color:#087fe9}.primary:hover{background:#0067ce}.notice{border-radius:12px;background:#eef6ff;padding:13px 16px;line-height:1.6;margin-top:15px;font-size:12px}input[type=checkbox]{appearance:none;width:34px;height:20px;border-radius:20px;padding:0;background:#c4d4e6;position:relative;cursor:pointer}input[type=checkbox]:after{content:'';position:absolute;background:white;width:14px;height:14px;border-radius:50%;top:2px;left:2px}input[type=checkbox]:checked{background:#087fe9}input[type=checkbox]:checked:after{left:16px}#message{white-space:pre-wrap}#message.error{background:#fff0f1;color:#a52b3d}.hidden{display:none}@media(max-width:760px){.layout{grid-template-columns:1fr}aside{display:flex;flex-wrap:wrap}aside button{width:auto}.form{grid-template-columns:1fr}header{flex-wrap:wrap}}
</style></head><body><header><strong>◉ Network LABS</strong><span id="project">Gestion native</span><button id="refresh">↻ Actualiser</button></header><div class="layout"><aside><div class="muted">GESTION DE L’ÉQUIPEMENT</div><button data-page="interfaces" class="active">▦ Interfaces</button><button data-page="routes">↗ Routes déclarées</button><button data-page="firewall">◇ Politique pare-feu</button></aside><main><div class="brand"><strong id="identity">Gestion web</strong><span>Linux · Projet natif</span></div><section class="card"><h1 id="title">Interfaces</h1><p class="muted" id="observed"></p><div id="listing" class="table"></div></section><section id="editor" class="card"><h2>Détails de l’interface</h2><form id="config"><div class="form"><label>Nom système<input id="name" required maxlength="63"></label><label>Interface<select id="port"></select></label><label>IPv4 / CIDR<input id="address" placeholder="192.168.10.1/24"></label><label>Passerelle<input id="gateway" placeholder="192.168.10.1"></label></div><label class="check"><input id="enabled" type="checkbox">Interface activée</label><div class="actions"><button id="apply" class="primary">Appliquer au brouillon</button><button type="button" id="reload">Recharger</button></div></form><div class="notice">Ces réglages modifient le projet natif partagé avec la GUI. Enregistrer puis arrêter / démarrer le laboratoire pour les activer sur le réseau.</div></section><div id="message" class="notice" role="status">Connexion à la session locale…</div></main></div><script>
'use strict';const $=id=>document.getElementById(id),params=new URLSearchParams(location.hash.slice(1));let node=params.get('node')||'',token=params.get('token')||'',state=null,page=params.get('page')||'interfaces',busy=false;history.replaceState(null,'',location.pathname);window.addEventListener('hashchange',()=>{if(location.hash)location.reload()});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function message(text,error=false){$('message').textContent=text;$('message').classList.toggle('error',error)}
async function request(path,data){let response=await fetch(path,{method:data?'POST':'GET',headers:{Authorization:'Bearer '+token,...(data?{'Content-Type':'application/json'}:{})},...(data?{body:JSON.stringify(data)}:{})});let result=await response.json();if(!response.ok)throw Error(result.error||'Erreur HTTP '+response.status);return result}
function table(head,rows){return '<table><thead><tr>'+head.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function selectPort(){if(!state)return;let n=state.node,p=$('port').value;$('address').value=n.interfaces[p]||'';$('enabled').checked=!(n.shutdown||[]).includes(p);$('address').disabled=!state.editable||n.role==='switch'||(n.dhcp_clients||[]).includes(p);}
function render(){const n=state.node;$('project').textContent=state.project;$('identity').textContent=n.name+' · '+({firewall:'Pare-feu',router:'Routeur',switch:'Switch',host:'Hôte'}[n.role]||n.role);$('observed').textContent='Relevé du logiciel : '+state.observed+' · '+n.runtime.toUpperCase();$('title').textContent=({interfaces:'Interfaces',routes:'Routes déclarées',firewall:'Politique pare-feu'})[page];$('editor').classList.toggle('hidden',page!=='interfaces');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
if(page==='interfaces'){$('listing').innerHTML=table(['Nom','Adresse IPv4','Admin',''],Object.entries(n.interfaces).map(([p,a])=>[esc(p),esc(a||'—'),(n.shutdown||[]).includes(p)?'Arrêté':'<span class="good">Activé</span>','<button type="button" data-port="'+esc(p)+'">Modifier</button>']));$('listing').querySelectorAll('[data-port]').forEach(b=>b.onclick=()=>{$('port').value=b.dataset.port;selectPort();$('address').focus()})}
if(page==='routes'){$('listing').innerHTML=table(['Destination','Passerelle','Interface'],[...(n.gateway?[['0.0.0.0/0',n.gateway,'—']]:[]),...(n.routes||[]).map(r=>[r.to||r.destination||'—',r.gateway||'—',r.interface||'—'])].map(r=>r.map(esc)));if(!n.gateway&&!(n.routes||[]).length)$('listing').innerHTML='<p>Aucune route statique déclarée.</p>'}
if(page==='firewall'){$('listing').innerHTML=n.firewall?'<pre></pre>':'<p>Aucune politique pare-feu déclarée sur cet équipement.</p>';if(n.firewall)$('listing').querySelector('pre').textContent=JSON.stringify(n.firewall,null,2)}
$('name').value=n.name;$('gateway').value=n.gateway||'';$('port').innerHTML=Object.keys(n.interfaces).map(p=>'<option>'+esc(p)+'</option>').join('');for(const id of ['name','port','enabled','apply'])$(id).disabled=!state.editable;$('gateway').disabled=!state.editable||n.role==='switch';selectPort();}
async function load(){if(busy)return;busy=true;try{state=await request('/api/state?node='+encodeURIComponent(node));render();message('Projet synchronisé. Les adresses affichées sont celles du brouillon.')}catch(e){message(e.message,true)}finally{busy=false}}
$('port').onchange=selectPort;$('refresh').onclick=load;$('reload').onclick=load;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;if(state)render()});$('config').onsubmit=async event=>{event.preventDefault();if(busy||!state)return;busy=true;$('apply').disabled=true;try{state=await request('/api/apply',{node,revision:state.revision,name:$('name').value.trim(),port:$('port').value,address:$('address').value.trim(),gateway:$('gateway').value.trim(),enabled:$('enabled').checked});node=state.node.name;render();message('Brouillon appliqué et synchronisé avec la GUI. Enregistrer puis arrêter / démarrer pour activer les changements.')}catch(e){message(e.message,true)}finally{busy=false;$('apply').disabled=!state.editable}};load();
</script><script src="/native_options.js"></script></body></html>

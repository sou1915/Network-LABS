<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Network LABS · Device Manager</title>
<style>
:root{--bg:#f3f5f9;--ink:#18263c;--muted:#66758c;--line:#e1e6ef;--blue:#265ed8;--rail:#142238;--green:#198261;--red:#bb3545}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,"Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}button,select{cursor:pointer}button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:9px 15px;color:var(--ink);font-weight:600}button:hover{background:#f0f4fb}button.primary{background:var(--blue);border-color:var(--blue);color:white}button.danger{color:var(--red)}button:disabled{opacity:.5;cursor:wait}.shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}aside{background:var(--rail);color:#c3cfe1;padding:26px 18px;position:fixed;inset:0 auto 0 0;width:238px;display:flex;flex-direction:column}.logo{display:flex;align-items:center;gap:10px;color:white;font-weight:750;letter-spacing:1px;font-size:17px}.logo svg{width:30px;height:30px;color:#91b8ff}.railcap{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:#8094b0;margin:28px 12px 12px}.brand{padding:14px 12px;border:1px solid #314259;border-radius:8px;margin-top:25px}.brand strong{display:block;color:#fff;font-size:16px}.brand small{display:block;font-size:12px;color:#b4c2d6;margin-top:4px}nav button{display:block;width:100%;text-align:left;color:#bfcde1;background:none;border:0;font-weight:500;margin:4px 0;padding:11px 14px}nav button:hover{background:#233750}nav button.active{background:#2d4870;color:#fff;border-left:3px solid #89b4ff;padding-left:11px}.railfoot{margin-top:auto;border-top:1px solid #30415b;padding:20px 10px 0;font-size:11px;color:#94a7c3}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3ac995;margin-right:6px}main{grid-column:2;min-width:0}.topbar{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 36px;gap:15px}.crumb{color:var(--muted);font-size:12px}.crumb strong{color:var(--ink);display:block;font-size:15px}.actions{display:flex;gap:9px;align-items:center;min-width:0}.actions button{white-space:nowrap}.actions select{min-width:0;max-width:230px;background:#fff;border:1px solid var(--line);border-radius:7px;padding:8px}.content{max-width:1360px;margin:auto;padding:30px 36px 50px}h1{font-size:27px;letter-spacing:-.7px;margin:0 0 3px;font-weight:650}h2{font-size:16px;margin:0 0 17px;font-weight:650}p.sub{margin:0 0 25px;color:var(--muted)}.eyebrow{color:var(--blue);text-transform:uppercase;font-size:10px;font-weight:700;letter-spacing:1.6px;margin-bottom:8px}.badge{font-size:11px;background:#e7f4ef;color:#247554;padding:4px 9px;border-radius:20px;font-weight:600;white-space:nowrap}.badge.off{background:#fbe9ec;color:var(--red)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:24px 0}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px}.metric .name{font-size:12px;color:var(--muted)}.metric .num{font-size:28px;font-weight:650;margin:8px 0 0}.metric .hint{font-size:11px;color:var(--muted);margin-top:3px}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.bar h2{margin:0}.ports{display:flex;flex-wrap:wrap;gap:8px}.port{width:65px;padding:12px 4px 8px;border-radius:6px;background:#f2f5f9;text-align:center;border:1px solid var(--line);font-size:10px;color:var(--muted)}.port:before{content:"";display:block;width:26px;height:20px;border:2px solid #afbbcd;border-radius:3px;margin:0 auto 7px;background:#e4e9f1}.port.up{color:var(--green);background:#f0f9f5;border-color:#b8dece}.port.up:before{border-color:#2b966f;background:#d3ecdf}.meta{display:grid;grid-template-columns:150px 1fr;gap:13px;font-size:13px}.meta dt{color:var(--muted)}.meta dd{margin:0;word-break:break-word}.note{font-size:12px;color:var(--muted);background:#f7f9fc;border:1px solid var(--line);padding:14px 16px;border-radius:7px;margin-top:20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:17px 24px}label{display:block;font-size:12px;font-weight:600;color:#4b5d76;margin-bottom:6px}input,select,textarea{width:100%;background:#fff;border:1px solid #cdd6e4;border-radius:6px;padding:10px 11px;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:#7298eb;box-shadow:0 0 0 3px #e9f0ff}input[type=checkbox]{width:auto;box-shadow:none}.check{display:flex;gap:9px;align-items:center;padding:10px 0}.check label{margin:0}.span{grid-column:1/-1}.formactions{border-top:1px solid var(--line);padding-top:20px;margin-top:24px;display:flex;gap:10px;justify-content:flex-end}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;font-weight:600;color:#66758c;font-size:10px;letter-spacing:.6px;text-transform:uppercase;background:#f8fafc;padding:12px;border-bottom:1px solid var(--line)}td{padding:13px 12px;border-bottom:1px solid #edf0f5}tr:last-child td{border:0}pre{white-space:pre-wrap;word-break:break-word;font:12px/1.7 "DejaVu Sans Mono",monospace;color:#dce7f5;background:#152237;border-radius:8px;padding:20px;max-height:520px;overflow:auto}#toast{display:none;margin:0 0 20px;border:1px solid #b5d9c8;background:#edf8f1;color:#1c6042;border-radius:7px;padding:12px 16px}#toast.error{background:#fff0f2;border-color:#efc2c9;color:#982e40}.sectiongap{margin-top:22px}.quiet{color:var(--muted);font-size:12px}.empty{padding:35px;text-align:center;color:var(--muted)}.splitfields{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.statehead{display:flex;align-items:center;gap:12px}.mobilebrand{display:none}footer{font-size:10px;color:#8b98aa;margin-top:30px;border-top:1px solid var(--line);padding-top:16px;display:flex;justify-content:space-between}.loading{padding:80px;text-align:center;color:var(--muted)}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.topbar,.content{padding-left:24px;padding-right:24px}.actions select{max-width:155px}}@media(max-width:760px){.shell{grid-template-columns:minmax(0,1fr)}aside{position:relative;width:100%;min-width:0;padding:15px}nav{min-width:0}.card,.formgrid>div{min-width:0}.tablewrap{max-width:100%}.brand,.railcap,.railfoot{display:none}nav{display:flex;overflow:auto;margin-top:12px}nav button{white-space:nowrap;width:auto}.logo{font-size:13px}main{grid-column:1}.topbar{padding:12px;height:auto;flex-wrap:wrap}.content{padding:20px 14px}.formgrid,.splitfields{grid-template-columns:1fr}.cards{gap:10px}.card{padding:17px}.actions button{padding:8px}.crumb{display:none}}
</style></head><body>
<div class="shell"><aside><div class="logo"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 7h20L16 26z"/><circle cx="6" cy="7" r="3" fill="#142238"/><circle cx="26" cy="7" r="3" fill="#142238"/><circle cx="16" cy="26" r="3" fill="#142238"/></svg>NETWORK LABS</div><div class="brand"><strong id="brand">Device Manager</strong><small id="model">Connexion au simulateur…</small></div><div class="railcap">Gestion de l'équipement</div><nav id="nav"></nav><div class="railfoot"><span class="dot"></span>Management local<br>Configuration partagée avec le logiciel</div></aside>
<main><header class="topbar"><div class="crumb">Équipements / Gestion web<strong id="deviceTitle">Chargement</strong></div><div class="actions"><select id="inventory" aria-label="Équipement"></select><button id="refresh">Actualiser</button><button id="cli">Ouvrir CLI</button></div></header><div class="content"><div id="toast" role="status"></div><div id="page"><div class="loading">Connexion à votre lab…</div></div><footer><span>Network LABS · Interface web de simulation</span><span>Local device management</span></footer></div></main></div>
<script>
const params=new URLSearchParams(location.hash.slice(1));let node=params.get('node'),token=params.get('token'),S=null,page='overview',dirty=false,selectedPort='',busy=false;
const $=id=>document.getElementById(id),e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(message,error=false){const t=$('toast');t.textContent=message;t.className=error?'error':'';t.style.display='block';t.scrollIntoView({block:'nearest'});}
async function api(action,data={}){const get=action==='state';let res=await fetch(get?'/api/state?node='+encodeURIComponent(node):'/api/'+action,{method:get?'GET':'POST',headers:{Authorization:'Bearer '+token,...(!get?{'Content-Type':'application/json'}:{})},...(!get?{body:JSON.stringify({node,...data})}:{})});let out=await res.json();if(!res.ok)throw Error(out.error||'Erreur du simulateur');return out;}
function badge(up){return `<span class="badge ${up?'':'off'}">${up?'Actif':'Inactif'}</span>`}
function input(id,label,value='',type='text'){return `<div><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${e(value)}"></div>`}
function select(id,label,value,options){return `<div><label for="${id}">${label}</label><select id="${id}">${options.map(x=>{let [v,t]=Array.isArray(x)?x:[x,x];return `<option value="${e(v)}" ${String(v)===String(value)?'selected':''}>${e(t)}</option>`}).join('')}</select></div>`}
function check(id,label,value){return `<div class="check"><input type="checkbox" id="${id}" ${value?'checked':''}><label for="${id}">${label}</label></div>`}
const val=id=>{let x=$(id).value.trim();if(/[\r\n]/.test(x))throw Error('Un seul champ par ligne.');return x},bool=id=>$(id).checked;
function title(name,subtitle){return `<div class="eyebrow">${e(S.profile.role)} / ${e(S.node.name)}</div><h1>${name}</h1><p class="sub">${subtitle}</p>`}
function form(body,label='Appliquer les modifications'){return `<form id="form"><div class="card"><div class="formgrid">${body}</div><div class="formactions"><button type="submit" class="primary">${label}</button></div></div></form>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}" class="empty">Aucun élément configuré</td></tr>`}</tbody></table></div>`}
function row(items){return '<tr>'+items.map(x=>`<td>${x}</td>`).join('')+'</tr>'}
function note(s){return `<div class="note">${e(s)}</div>`}
function menu(){let n=S.node,items=[['overview',"Vue d’ensemble"],[n.kind==='PC'?'network':'ports',n.kind==='PC'?'Réseau IPv4':'Interfaces']];if(n.kind==='Switch'&&S.profile.role!=='Firewall')items.push(['vlans','VLANs'],['switching','Switching']);if(S.profile.role==='Firewall')items.push(['firewall','Politique firewall']);if(S.profile.role==='Serveur')items.push(['dns','DNS local']);if(n.kind==='Routeur')items.push(['router','Sous-interfaces'],['dhcp','Serveur DHCP']);if(n.kind==='PC')items.push(['services','Services LAN'],['diagnostics','Diagnostics']);items.push(['config','Configuration']);$('nav').innerHTML=items.map(([id,t])=>`<button data-page="${id}" class="${page===id?'active':''}">${t}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));$('nav').querySelector('.active')?.scrollIntoView({block:'nearest',inline:'center'});}
function navigate(next){if(dirty&&next!==page){toast('Formulaire non appliqué. Appliquer ou Actualiser avant de changer de page.',true);return;}page=next;render();}
async function load(){S=await api('state');dirty=false;const names=S.inventory.map(x=>`<option value="${e(x.id)}" ${x.id===node?'selected':''}>${e(x.id+' · '+x.model)}</option>`).join('');$('inventory').innerHTML=names;$('brand').textContent=S.profile.brand;$('model').textContent=S.profile.model;$('deviceTitle').textContent=(S.node.hostname||node)+' · '+S.profile.role;document.title=(S.node.hostname||node)+' | Network LABS';render();}
async function apply(commands){if(busy)return;busy=true;document.querySelectorAll('button[type=submit]').forEach(b=>b.disabled=true);try{S=await api('apply',{revision:S.revision,commands});dirty=false;render();toast('Configuration appliquée. Le logiciel et la CLI sont synchronisés.');}catch(err){toast(err.message,true);}finally{busy=false;document.querySelectorAll('button[type=submit]').forEach(b=>b.disabled=false);}}
function submit(fn){$('form').onsubmit=ev=>{ev.preventDefault();try{apply(fn());}catch(err){toast(err.message,true);}};}
function render(){if(!S)return;window.scrollTo(0,0);menu();const n=S.node;let html='';if(page==='overview'){
let ports=Object.entries(n.ports).filter(([k])=>!k.includes('.')&&!k.startsWith('po')),up=S.links.filter(x=>x.enabled).length;
html=title('Vue d’ensemble','État et configuration de votre équipement dans le réseau simulé.')+`<div class="cards">${[['Interfaces',ports.length,'Ports du profil'],['Liens actifs',up,'Liaisons physiques'],['IPv4',n.address||'—',n.address_mode==='dhcp'?'Adressage DHCP':'Configuration locale'],['Services',Object.keys(n.services||{}).length,'Ports applicatifs simulés']].map(([k,v,h])=>`<div class="card metric"><div class="name">${k}</div><div class="num" style="${String(v).length>9?'font-size:19px':''}">${e(v)}</div><div class="hint">${h}</div></div>`).join('')}</div><div class="grid"><section class="card"><div class="bar"><h2>Interfaces physiques</h2><span class="badge">${ports.length} ports</span></div><div class="ports">${ports.map(([k,p])=>{let link=S.links.find(x=>x.port===k);return `<button class="port ${link?.enabled&&!p.shutdown?'up':''}" data-port="${e(k)}">${e(k)}</button>`}).join('')}</div>${note('Les indicateurs reflètent le câblage et l’état administratif, pas une mesure de débit.')}</section><section class="card"><h2>Informations système</h2><dl class="meta">${[['Identifiant',n.name],['Marque',S.profile.brand],['Modèle',S.profile.model],['Rôle',S.profile.role],['MAC',n.mac],['Hostname',n.hostname||n.name]].map(([k,v])=>`<dt>${k}</dt><dd>${e(v)}</dd>`).join('')}</dl></section></div>`+form(input('hostname','Nom système',n.hostname||n.name),'Appliquer le nom')+note(S.profile.scope);
$('page').innerHTML=html;submit(()=>['hostname '+val('hostname')]);document.querySelectorAll('[data-port]').forEach(b=>b.onclick=()=>{selectedPort=b.dataset.port;navigate(n.kind==='PC'?'network':'ports')});
}else if(page==='network'){
html=title('Réseau IPv4','Adressage et configuration de l’interface Ethernet.')+form(select('mode','Méthode IPv4',n.address_mode,[['static','Statique'],['dhcp','DHCP']])+input('address','Adresse / CIDR',n.address)+input('gateway','Passerelle par défaut',n.gateway)+input('dns','Serveurs DNS (espaces)',''+n.dns.join(' '))+check('up','Interface eth0 active',!n.ports.eth0.shutdown))+note('En DHCP, les valeurs statiques sont ignorées. Le serveur doit être accessible pour obtenir une configuration.');$('page').innerHTML=html;submit(()=>{let c=['ip link '+(bool('up')?'up':'down')];if(val('mode')==='dhcp'){if(bool('up'))c.push('ip dhcp');else if(n.address_mode!=='dhcp')throw Error('Activer eth0 pour une première obtention DHCP.');}else c.push(val('address')?'ip address '+val('address'):'no ip address',val('gateway')?'ip gateway '+val('gateway'):'no ip gateway',val('dns')?'ip dns '+val('dns'):'no ip dns');return c});
}else if(page==='ports'){
let keys=Object.keys(n.ports);if(!keys.includes(selectedPort))selectedPort=keys[0];let p=n.ports[selectedPort];
html=title('Interfaces','Paramètres physiques, VLAN et état administratif.')+`<div class="card sectiongap" style="margin-bottom:20px">${select('port','Interface sélectionnée',selectedPort,keys)}</div>`+form(input('description','Description',p.description)+check('up','Interface administrativement active',!p.shutdown)+(n.kind==='Switch'?select('mode','Mode',p.mode,['access','trunk','dynamic auto','dynamic desirable'])+input('access','VLAN access',p.access_vlan)+input('native','VLAN natif',p.native_vlan)+input('allowed','VLANs autorisés',p.allowed)+input('cost','Coût STP',p.cost)+check('portfast','PortFast',p.portfast)+check('guard','BPDU Guard',p.bpduguard)+check('trusted','DHCP snooping trusted',p.dhcp_trust):''));$('page').innerHTML=html;$('port').onchange=()=>{if(dirty){$('port').value=selectedPort;toast('Appliquer ou Actualiser les paramètres avant de changer de port.',true);return;}selectedPort=$('port').value;render();};submit(()=>['interface '+selectedPort,val('description')?'description '+val('description'):'no description',...(n.kind==='Switch'?['switchport mode '+val('mode'),'switchport access vlan '+val('access'),'switchport trunk native vlan '+val('native'),'switchport trunk allowed vlan '+val('allowed'),'spanning-tree cost '+val('cost'),(bool('portfast')?'':'no ')+'spanning-tree portfast',(bool('guard')?'':'no ')+'spanning-tree bpduguard enable',(bool('trusted')?'':'no ')+'ip dhcp snooping trust']:[]),bool('up')?'no shutdown':'shutdown','end']);
}else if(page==='vlans'){
html=title('VLANs','Segmentation du réseau local.')+`<section class="card">${table(['VLAN ID','Nom'],Object.entries(n.vlans).sort((a,b)=>+a[0]-b[0]).map(([id,name])=>row([e(id),e(name)])))}</section><div class="sectiongap">`+form(input('vlan','VLAN ID','10')+input('vname','Nom','USERS'),'Créer / modifier le VLAN')+`</div><button class="danger sectiongap" id="deleteVlan">Supprimer le VLAN indiqué</button>`;$('page').innerHTML=html;submit(()=>['vlan '+val('vlan'),'name '+val('vname'),'exit']);$('deleteVlan').onclick=()=>apply(['no vlan '+val('vlan')]);
}else if(page==='firewall'){
html=title('Politique firewall','Filtrage transparent IPv4 · décisions ordonnées par ID.')+`<div class="cards">${[['Mode',n.firewall_mode],['Politique',n.firewall_default],['Autorisés',S.counters.allow],['Refusés',S.counters.deny]].map(([k,v])=>`<div class="card metric"><div class="name">${k}</div><div class="num" style="font-size:23px">${e(v)}</div></div>`).join('')}</div><section class="card"><h2>Règles de trafic</h2>${table(['ID','Action','Protocole','Source','Destination','Port service'],n.firewall_rules.sort((a,b)=>a.id-b.id).map(r=>row([e(r.id),`<span class="badge ${r.action==='deny'?'off':''}">${e(r.action)}</span>`,e((r.protocol||'icmp').toUpperCase()),e(r.source),e(r.target),e(r.port||'Tous')])) )}</section><div class="sectiongap">`+form(input('ruleid','ID / ordre','10','number')+select('action','Action','allow',['allow','deny'])+select('proto','Protocole','tcp',['tcp','udp','icmp','any'])+input('rport','Port service / any','443')+input('src','Source CIDR / any','any')+input('dst','Destination CIDR / any','any'),'Ajouter / remplacer la règle')+`</div><button id="deleteRule" class="danger sectiongap">Supprimer cet ID</button><section class="card sectiongap"><h2>Politique globale</h2><div class="formgrid">${select('fwmode','Suivi d’état',n.firewall_mode,['stateful','stateless'])+select('fwdefault','Action par défaut',n.firewall_default,['deny','allow'])}</div><div class="formactions"><button id="fwpolicy" class="primary">Appliquer la politique</button></div></section>`+note('Transactions ICMP/TCP/UDP modélisées. Les ports sont des ports de service pour l’aller et le retour ; aucun handshake, NAT, VPN ou moteur applicatif réel.');$('page').innerHTML=html;submit(()=>['firewall rule '+val('ruleid')+' '+val('action')+' '+val('proto')+' '+val('src')+' '+val('dst')+' '+(['icmp','any'].includes(val('proto'))?'any':val('rport'))]);$('deleteRule').onclick=()=>apply(['firewall rule delete '+val('ruleid')]);$('fwpolicy').onclick=()=>apply(['firewall mode '+val('fwmode'),'firewall default '+val('fwdefault')]);
}else if(page==='dns'){
html=title('DNS local','Enregistrements A de votre réseau LAN.')+`<section class="card"><div class="bar"><h2>Zone locale</h2>${badge(n.dns_service)}</div>${table(['Nom','Type','Adresse IPv4'],Object.entries(n.dns_records).map(([name,ip])=>row([e(name),'A',e(ip)])))}</section><div class="sectiongap">`+form(input('dname','Nom DNS','printer.lan')+input('dip','Adresse IPv4','192.168.10.20'),'Ajouter / remplacer un enregistrement')+`</div><div class="actions sectiongap"><button id="dnsToggle">${n.dns_service?'Désactiver':'Activer'} le service</button><button id="dnsDelete" class="danger">Supprimer le nom indiqué</button></div>`+note('Résolution locale A. Sans cache, récursion Internet, CNAME ou DNSSEC.');$('page').innerHTML=html;submit(()=>['dns record '+val('dname')+' '+val('dip')]);$('dnsToggle').onclick=()=>apply([(n.dns_service?'no ':'')+'service dns']);$('dnsDelete').onclick=()=>apply(['no dns record '+val('dname')]);
}else if(page==='services'){
html=title('Services LAN','Disponibilité des ports applicatifs simulés.')+`<section class="card">${table(['Protocole / port','Service'],Object.entries(n.services||{}).map(([key,label])=>row([e(key),e(label)])))}</section><div class="sectiongap">`+form(select('svcproto','Protocole','tcp',['tcp','udp'])+input('svcport','Port',80,'number')+input('svcname','Nom du service','HTTP'),'Activer le service')+`</div><button id="svcOff" class="danger sectiongap">Désactiver ce port</button>`+note('Un service activé permet de tester la connectivité et le filtrage. Aucune impression, vidéo, session SMB, téléphonie ou application HTTP réelle n’est exécutée.');$('page').innerHTML=html;submit(()=>['listen '+val('svcproto')+' '+val('svcport')+' '+val('svcname')]);$('svcOff').onclick=()=>apply(['unlisten '+val('svcproto')+' '+val('svcport')]);
}else if(page==='diagnostics'){
html=title('Diagnostics réseau','Tester le trajet aller-retour et les politiques appliquées.')+form(select('testproto','Type de test','icmp',[['icmp','Ping / ICMP'],['tcp','Port TCP'],['udp','Port UDP']])+input('target','Destination IPv4 ou nom DNS','192.168.10.20')+input('testport','Port de service',443,'number'),'Exécuter le test')+`<section id="testResult" class="card sectiongap" hidden><h2>Résultat de simulation</h2><pre id="trace"></pre></section>`;$('page').innerHTML=html;$('form').onsubmit=async ev=>{ev.preventDefault();try{const r=await api('test',{target:val('target'),protocol:val('testproto'),port:val('testport')});$('testResult').hidden=false;$('trace').textContent=(r.ok?'SUCCESS\n':'FAILED\n')+r.trace.join('\n')+'\n\n'+r.firewall_log.join('\n');dirty=false;}catch(err){toast(err.message,true);}};
}else if(page==='switching'){
html=title('Switching','Paramètres globaux du moteur LAN partagé.')+form(select('stpmode','Mode STP',n.stp_mode,['pvst','rapid-pvst','mst'])+input('stpid','VLAN / instance MST','1')+input('priority','Priorité STP','32768')+select('vtpmode','Mode VTP v2',n.vtp_mode,['transparent','server','client','off'])+input('domain','Domaine VTP',n.vtp_domain)+input('password','Mot de passe VTP',n.vtp_password,'password')+check('snoop','DHCP snooping',n.dhcp_snooping)+check('igmp','IGMP snooping',n.igmp_enabled),'Appliquer les paramètres')+note('Les options avancées MST, EtherChannel et sécurité restent également disponibles dans les formulaires bureau et la CLI.');$('page').innerHTML=html;submit(()=>['spanning-tree mode '+val('stpmode'),(val('stpmode')==='mst'?'spanning-tree mst ':'spanning-tree vlan ')+val('stpid')+' priority '+val('priority'),'vtp version 2',val('domain')?'vtp domain '+val('domain'):'no vtp domain',val('password')?'vtp password '+val('password'):'no vtp password','vtp mode '+val('vtpmode'),(bool('snoop')?'':'no ')+'ip dhcp snooping',(bool('igmp')?'':'no ')+'ip igmp snooping']);
}else if(page==='router'){
html=title('Sous-interfaces IPv4','Routage connecté 802.1Q du LAN.')+`<section class="card">${table(['Interface','VLAN','IPv4'],Object.entries(n.ports).filter(([k,p])=>p.sub_vlan).map(([k,p])=>row([e(k),e(p.sub_vlan),e(p.address)])))}</section><div class="sectiongap">`+form(input('subif','Sous-interface','gi0/0.10')+input('tag','VLAN 802.1Q','10')+input('subip','IPv4 / CIDR','192.168.10.1/24'),'Créer / modifier la sous-interface')+`</div><button id="subDelete" class="danger sectiongap">Supprimer la sous-interface indiquée</button>`;$('page').innerHTML=html;submit(()=>['interface '+val('subif'),'encapsulation dot1Q '+val('tag'),'ip address '+val('subip'),'no shutdown','end']);$('subDelete').onclick=()=>apply(['no interface '+val('subif')]);
}else if(page==='dhcp'){
html=title('Serveur DHCP','Pools et options d’adressage automatique.')+`<section class="card"><div class="bar"><h2>Pools configurés</h2>${badge(n.dhcp_service)}</div>${table(['Pool','Réseau','Passerelle','DNS'],Object.entries(n.dhcp_pools).map(([name,p])=>row([e(name),e(p.network||'—'),e(p.gateway||'—'),e((p.dns||[]).join(', '))])))}</section><div class="sectiongap">`+form(input('pool','Nom du pool','LAN')+input('poolnet','Réseau / CIDR','192.168.10.0/24')+input('poolgw','Passerelle','192.168.10.1')+input('pooldns','DNS (espaces)','192.168.10.2'),'Créer / remplacer le pool')+`</div><div class="actions sectiongap"><button id="dhcpToggle">${n.dhcp_service?'Désactiver':'Activer'} le service DHCP</button><button id="poolDelete" class="danger">Supprimer le pool indiqué</button></div>`+note('La modification d’un pool conserve les clients déjà configurés jusqu’à leur renouvellement. Les exclusions et baux avancés sont accessibles dans le logiciel et la CLI.');$('page').innerHTML=html;submit(()=>['no ip dhcp pool '+val('pool'),'ip dhcp pool '+val('pool'),'network '+val('poolnet'),...(val('poolgw')?['default-router '+val('poolgw')]:[]),...(val('pooldns')?['dns-server '+val('pooldns')]:[]),'exit','end']);$('dhcpToggle').onclick=()=>apply([(n.dhcp_service?'no ':'')+'service dhcp']);$('poolDelete').onclick=()=>apply(['no ip dhcp pool '+val('pool')]);
}else{
html=title('Configuration courante','Lecture de l’état partagé avec la CLI et les formulaires.')+`<section class="card"><h2>Configuration / état réseau</h2><pre>${e(S.configuration)}</pre></section>`+note(S.profile.scope);$('page').innerHTML=html;
}
$('page').querySelectorAll('input,textarea,select').forEach(el=>{if(el.id!=='port')el.addEventListener('input',()=>dirty=true)});
}
$('refresh').onclick=()=>{load().then(()=>toast('Configuration actualisée depuis le simulateur.')).catch(err=>toast(err.message,true));};
$('cli').onclick=()=>api('cli').then(()=>toast('Console ouverte dans le logiciel.')).catch(err=>toast(err.message,true));
$('inventory').onchange=()=>{if(dirty){$('inventory').value=node;toast('Appliquer ou Actualiser le formulaire avant de changer d’équipement.',true);return;}node=$('inventory').value;params.set('node',node);location.hash=params.toString();page='overview';load().catch(err=>toast(err.message,true));};
if(!node||!token){$('page').innerHTML='<div class="card"><h1>Ouvrir depuis Network LABS</h1><p>Dans le logiciel, sélectionner un équipement puis « Interface web ».</p></div>';}else load().catch(err=>toast(err.message,true));
</script></body></html>

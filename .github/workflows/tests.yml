name: Network LABS checks
on: [push, pull_request]
jobs:
  switching-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated switching prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends crun iproute2 busybox-static util-linux tcpdump
      - name: Prepare bonding without host bonds
        run: |
          uname -r
          ip -Version
          sudo modprobe bonding max_bonds=0
      - name: Verify real trunk VLAN edits, tags, native pruning, rollback and restart
        run: sudo env NETWORK_LABS_NATIVE_TESTS=1 /usr/bin/python3 -m unittest discover -s tests -p test_native_trunk_vlan.py -v
      - name: Verify common STP and LACP restore packet path
        run: sudo env NETWORK_LABS_NATIVE_TESTS=1 /usr/bin/python3 -m unittest discover -s tests -p test_native_integration.py -k test_common_stp_uses -v
  ssh-access:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated SSH prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dropbear-bin openssh-client crun iproute2 busybox-static util-linux
      - name: Verify server-enforced SSH actions, bypass denials and saved restart
        run: sudo env NETWORK_LABS_NATIVE_TESTS=1 /usr/bin/python3 -m unittest discover -s tests -p test_native_ssh_access.py -v
  radius-interop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install independent RADIUS server
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends freeradius crun iproute2 busybox-static util-linux
      - name: Verify accounting writer failures and concurrent appends
        run: /usr/bin/python3 -m unittest discover -s tests -p test_radius_accounting_writer.py -v
      - name: Verify real FreeRADIUS PAP decisions and listener cleanup
        run: env NETWORK_LABS_RADIUS_INTEROP=1 /usr/bin/python3 -m unittest discover -s tests -p test_radius_freeradius.py -v
      - name: Verify managed RADIUS containers, policy and saved restart
        run: sudo env NETWORK_LABS_NATIVE_TESTS=1 /usr/bin/python3 -m unittest discover -s tests -p test_native_integration.py -k test_managed_radius -v
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-venv xvfb chrony
      - name: Install optional executable-appliance test runtime
        run: |
          /usr/bin/python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install -r experiments/micro_appliances/requirements.txt
      - name: Engine, CLI, desktop and executable appliance tests
        run: xvfb-run -a .venv-ci/bin/python -m unittest discover -s tests -v
      - name: Executable guest smoke check
        run: .venv-ci/bin/python -m network_labs.micro_appliances demo --json /tmp/micro-demo.json --pcap /tmp/micro-demo.pcap
      - name: Execute saved project with Wasm backend
        run: |
          .venv-ci/bin/python -m network_labs.micro_appliances project examples/wasm_lan.json --source PC1 --target 192.168.50.20 --json /tmp/project-ping.json --pcap /tmp/project-ping.pcap
          .venv-ci/bin/python -m network_labs.micro_appliances project examples/wasm_lan.json --source PC1 --target 192.168.50.20 --protocol tcp --port 8080
      - name: Python syntax
        run: /usr/bin/python3 -m compileall -q network_labs
  native-containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native appliance prerequisites
        run: sudo apt-get update && sudo apt-get install -y crun iproute2 busybox-static dnsmasq-base bird2 lldpd openvswitch-switch nftables conntrack tcpdump util-linux coreutils dropbear-bin openssh-client openssl rsyslog snmpd snmp snmptrapd chrony freeradius
      - name: Prepare Linux bonding without creating default host bonds
        run: |
          uname -r
          ip -Version
          sudo modprobe bonding max_bonds=0
          sudo modprobe openvswitch
      - name: Boot isolated nodes and verify actual packet delivery and cleanup
        run: sudo env NETWORK_LABS_NATIVE_TESTS=1 /usr/bin/python3 -m unittest discover -s tests -p test_native_integration.py -f -v

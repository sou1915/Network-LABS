name: Network LABS checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-venv xvfb
      - name: Install optional executable-appliance test runtime
        run: |
          /usr/bin/python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install -r experiments/micro_appliances/requirements.txt
      - name: Engine, CLI, desktop and executable appliance tests
        run: xvfb-run -a .venv-ci/bin/python -m unittest discover -s tests -v
      - name: Executable guest smoke check
        run: .venv-ci/bin/python -m network_labs.micro_appliances demo --json /tmp/micro-demo.json --pcap /tmp/micro-demo.pcap
      - name: Execute saved project with Wasm backend
        run: |
          .venv-ci/bin/python -m network_labs.micro_appliances project examples/wasm_lan.json --source PC1 --target 192.168.50.20 --json /tmp/project-ping.json --pcap /tmp/project-ping.pcap
          .venv-ci/bin/python -m network_labs.micro_appliances project examples/wasm_lan.json --source PC1 --target 192.168.50.20 --protocol tcp --port 8080
      - name: Python syntax
        run: /usr/bin/python3 -m compileall -q network_labs
  native-containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native appliance prerequisites
        run: sudo apt-get update && sudo apt-get install -y crun iproute2 busybox-static dnsmasq-base lldpd openvswitch-switch nftables conntrack tcpdump util-linux coreutils
      - name: Prepare Linux bonding without creating default host bonds
        run: |
          sudo modprobe bonding max_bonds=0
          sudo modprobe openvswitch
      - name: Boot isolated nodes and verify actual packet delivery and cleanup
        run: sudo env NETWORK_LABS_NATIVE_TESTS=1 /usr/bin/python3 -m unittest discover -s tests -p test_native_integration.py -f -v

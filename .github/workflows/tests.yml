name: Network LABS checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Validation scope (push and PR always run all jobs)
        type: choice
        default: all
        options:
          - all
          - benchmark-kernel-peak
          - dual-stack-ssh-host-key
          - ssh-radius-host-key
          - ssh-host-key
          - ipv6-dns-https
          - ipv6-https-firewall
          - ipv6-https
          - lan-readiness-retry
          - ipv6-dns-ospfv3-failover
          - ipv6-dns-ospfv3
          - syslog-recover
          - syslog-disk-queue
          - syslog-tls-lifecycle
          - https-identity-lifecycle
          - dot1x
          - ipv6-dns
          - ipv6-dns-firewall
          - ipv6-input-firewall
          - dns-aaaa
          - ipv6-tftp
          - ipv6-tftp-subinterfaces
          - ipv6-dns-tftp
          - ipv6-ntp
          - ipv6-ntp-relay
jobs:
  lan-core-acceptance:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'lan-readiness-retry'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install core LAN packet and service prerequisites
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" bash tools/ci_apt_install.sh crun iproute2 busybox-static util-linux tcpdump nftables conntrack dnsmasq-base bird2 lldpd
      - name: Verify core routing, VLAN gateways, DHCP and DNS services, dual stack and cold restore
        run: |
          sudo env NETWORK_LABS_NATIVE_TESTS=1 PYTHONPATH=tests /usr/bin/python3 -m unittest -v \
            test_native_integration.RealContainerTests.test_appliance_a_static_route_cli_return_path_longest_prefix_rollback_and_restore \
            test_native_integration.RealContainerTests.test_appliance_l3_svis_real_gateways_intervlan_trunk_shutdown_rollback_and_restore \
            test_native_integration.RealContainerTests.test_appliance_aa_lan_services_routed_dns_http_failures_pcap_and_restore \
            test_native_integration.RealContainerTests.test_dns_real_udp_tcp_dhcp_resolver_http_failure_config_drift_and_restore \
            test_native_integration.RealContainerTests.test_appliance_aj_multi_vlan_ospf_dhcp_isolation_helpers_scoped_recovery_restore \
            test_native_integration.RealContainerTests.test_appliance_aa_dual_stack_independent_forwarding_routes_capture_and_restore
  lan-core-ready:
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'lan-readiness-retry') }}
    needs: [lan-core-acceptance, benchmark-kernel-peak, switching-interop, ssh-access, radius-interop, dot1x-wired-interop, tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all seven essential LAN checks
        env:
          LAN_CORE_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCORE'
          import json, os
          checks = json.loads(os.environ['LAN_CORE_RESULTS'])
          rows = [(name, item['result']) for name, item in sorted(checks.items())]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## LAN core acceptance\n\n| Check | Result |\n| --- | --- |\n')
              for name, result in rows:
                  summary.write(f'| {name} | {result} |\n')
              summary.write('\nScope: existing bounded native LAN profiles; advanced extensions remain deferred.\n')
          failed = [name for name, result in rows if result != 'success']
          if len(rows) != 7 or failed:
              raise SystemExit('LAN core is blocked: ' + ', '.join(failed or ['missing checks']))
          print('LAN_CORE_READY: all seven essential checks passed')
          PYCORE
  ssh-shell-host-key-interop:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'ssh-radius-host-key'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated pinned SSH shell and journal prerequisites
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" bash tools/ci_apt_install.sh freeradius dropbear-bin openssh-client crun iproute2 busybox-static util-linux tcpdump gcc libc6-dev nftables
      - name: Verify pinned shell trust, worker death, orphan journal, Stop handoff and cold restore
        run: sudo env NETWORK_LABS_NATIVE_TESTS=1 /usr/bin/python3 -m unittest discover -s tests -p test_native_ssh_shell_host_key_integration.py -v
      - name: Verify pinned PTY, expiry, disconnect, complete accounting and unchanged restored trust
        run: sudo env NETWORK_LABS_NATIVE_TESTS=1 /usr/bin/python3 -m unittest discover -s tests -p test_native_ssh_shell_host_key_lifecycle_integration.py -v
      - name: Verify pinned shell Start and Stop receipt loss, durable uncertainty and explicit recovery
        run: sudo env NETWORK_LABS_NATIVE_TESTS=1 /usr/bin/python3 -m unittest discover -s tests -p test_native_ssh_shell_host_key_ack_loss_integration.py -v
  benchmark-kernel-peak:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'benchmark-kernel-peak' || inputs.suite == 'lan-readiness-retry'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated native benchmark prerequisites
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" bash tools/ci_apt_install.sh crun iproute2 busybox-static util-linux nftables conntrack tcpdump
      - name: Verify transient kernel peak and 20-node idle and traffic measurement
        run: sudo env NETWORK_LABS_NATIVE_TESTS=1 NETWORK_LABS_BENCHMARK_ARTIFACT_DIR="$RUNNER_TEMP/network-labs-benchmark-peak" /usr/bin/python3 -m unittest discover -s tests -p test_native_benchmark_peak_integration.py -v
      - name: Verify existing enterprise benchmark and actual return routes
        run: sudo env NETWORK_LABS_NATIVE_TESTS=1 PYTHONPATH=tests /usr/bin/python3 -m unittest test_native_integration.RealContainerTests.test_enterprise_twenty_nodes_benchmark_and_real_return_routes -v
      - name: Retain native measurement reports
        uses: actions/upload-artifact@v4
        with:
          name: native-benchmark-kernel-peak
          path: ${{ runner.temp }}/network-labs-benchmark-peak/*.json
          if-no-files-found: error
  dual-stack-ssh-host-key-interop:

      - name: Install isolated pinned dual-stack SSH and RADIUS prerequisites
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" bash tools/ci_apt_install.sh freeradius dropbear-bin openssh-client crun iproute2 busybox-static util-linux tcpdump
      - name: Verify pinned IPv4 and IPv6 SSH, IPv4 RADIUS, independent route loss and cold restore
        run: sudo env NETWORK_LABS_NATIVE_TESTS=1 /usr/bin/python3 -m unittest discover -s tests -p test_native_dual_stack_ssh_host_key_integration.py -v
  ssh-radius-host-key-interop:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'ssh-radius-host-key' || inputs.suite == 'dual-stack-ssh-host-key'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated pinned SSH and RADIUS prerequisites
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" bash tools/ci_apt_install.sh freeradius dropbear-bin openssh-client crun iproute2 busybox-static util-linux gcc libc6-dev
      - name: Verify strict host trust, RADIUS actions, denials, outages and cold restore
        run: sudo env NETWORK_LABS_NATIVE_TESTS=1 /usr/bin/python3 -m unittest discover -s tests -p test_native_ssh_radius_host_key_integration.py -v

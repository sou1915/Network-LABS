name: Network LABS checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Validation scope (push and PR always run all jobs)
        type: choice
        default: all
        options:
          - all
          - dot1x
          - ipv6-dns
          - ipv6-dns-firewall
          - ipv6-input-firewall
jobs:
  ipv6-input-firewall-interop:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'ipv6-input-firewall'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated IPv6 local input prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends crun iproute2 busybox-static util-linux nftables tcpdump dnsmasq
      - name: Verify local input allowance, denial, state, NDP, forwarding isolation and restore
        run: sudo env NETWORK_LABS_NATIVE_TESTS=1 /usr/bin/python3 -m unittest discover -s tests -p test_native_ipv6_input_firewall_integration.py -v
  ipv6-dns-firewall-interop:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'ipv6-dns-firewall' || inputs.suite == 'ipv6-input-firewall'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated DNS and IPv6 firewall prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends crun iproute2 busybox-static util-linux nftables conntrack tcpdump dnsmasq
      - name: Verify DNS wire, stateful returns, default denial, stateless control and cold restore
        run: sudo env NETWORK_LABS_NATIVE_TESTS=1 /usr/bin/python3 -m unittest discover -s tests -p test_native_ipv6_dns_firewall_integration.py -v
